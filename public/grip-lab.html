<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grip lab — sword-holding calibration</title>
<style>
  body { margin: 0; background: #171a21; color: #cbd5e1; font: 12px/1.5 system-ui, sans-serif; }
  #bar { padding: 6px 10px; display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  #bar b { color: #fbbf24; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.180.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.180.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="bar">
  <b>Grip lab</b>
  <span>tool rot <span id="v-r"></span> — tool pos <span id="v-p"></span></span>
  <span>override: ?rx=0&ry=0&rz=0&px=0&py=0&pz=0&attack=0.35&idlet=0.5&axes=1</span>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';

/* URL overrides — defaults mirror setHeldTool's current values */
const q = new URLSearchParams(location.search);
const num = (k, d) => { const v = parseFloat(q.get(k)); return Number.isFinite(v) ? v : d; };
const ROT = [num('rx', -0.5), num('ry', 0), num('rz', 0)];
const POS = [num('px', 0), num('py', -0.12), num('pz', 0.03)];
const ATTACK_T = num('attack', 0.4);   // freeze point inside the Sword attack clip (0..1)
const IDLE_T = num('idlet', 0.5);      // freeze point inside Sword idle
const AXES = q.get('axes') === '1';
const BAR_H = 34;
document.getElementById('v-r').textContent = ROT.map((v) => v.toFixed(2)).join(', ');
document.getElementById('v-p').textContent = POS.map((v) => v.toFixed(2)).join(', ');

const BAKED_HIP = 0.95;
const slugify = (n) => n.toLowerCase().replace(/[^a-z0-9]+/g, '-');
const rawCache = new Map();
function fetchRaw(name) {
  if (!rawCache.has(name)) rawCache.set(name, fetch(`/models/clips/anim-${slugify(name)}.json`).then((r) => (r.ok ? r.json() : null)).catch(() => null));
  return rawCache.get(name);
}
function bonesOf(body) {
  const map = {};
  body.traverse((o) => { if (o.isBone && o.name && !map[o.name]) map[o.name] = o; });
  return map;
}
/* faithful port of the game's toClip() (clipLibrary.ts) */
async function buildClip(bodyRoot, name) {
  const raw = await fetchRaw(name);
  if (!raw) return null;
  const bones = bonesOf(bodyRoot);
  if (!['Hips', 'Spine2', 'LeftForeArm', 'RightUpLeg'].every((n) => bones[n])) return null;
  const tracks = [];
  for (const [bone, values] of Object.entries(raw.tracks)) {
    const b = bones[bone];
    if (!b || !values.length) continue;
    tracks.push(new THREE.QuaternionKeyframeTrack(`${b.uuid}.quaternion`, raw.times.slice(), Float32Array.from(values)));
  }
  const rest = bones.Hips.position.clone();
  const ratio = (rest.y || BAKED_HIP) / BAKED_HIP;
  const pos = new Float32Array(raw.hips.length);
  for (let i = 0; i < raw.hips.length; i += 3) {
    pos[i] = rest.x; pos[i + 1] = rest.y + raw.hips[i + 1] * ratio; pos[i + 2] = rest.z;
  }
  tracks.push(new THREE.VectorKeyframeTrack(`${bones.Hips.uuid}.position`, raw.times.slice(), pos));
  return new THREE.AnimationClip(name, -1, tracks);
}

const loader = new GLTFLoader();
const load = (url) => new Promise((res, rej) => loader.load(url, (g) => res(g), undefined, rej));

function prep(gltf, h) {
  const scene = gltf.scene;
  scene.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(scene);
  const hh = Math.max(0.01, box.max.y - box.min.y);
  const s = h / hh;
  const body = new THREE.Group();
  body.add(scene);
  body.scale.setScalar(s);
  return { body, scene };
}

function axesGizmo(parent, len = 0.12) {
  const mk = (dir, col) => parent.add(new THREE.ArrowHelper(dir, new THREE.Vector3(0, 0, 0), len, col));
  mk(new THREE.Vector3(1, 0, 0), 0xff4444); // +X red
  mk(new THREE.Vector3(0, 1, 0), 0x44ff44); // +Y green
  mk(new THREE.Vector3(0, 0, 1), 0x4488ff); // +Z blue
}

/* the weapon — the same file the game holds */
async function buildSword() {
  const gltf = await load('/models/weapons/arming-sword-401972.glb');
  const scene = gltf.scene;
  scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(scene);
  console.log('sword bbox min', box.min.toArray().map((v) => v.toFixed(3)), 'max', box.max.toArray().map((v) => v.toFixed(3)));
  scene.scale.setScalar(1.05); // game's calibration
  scene.traverse((o) => { if (o.isMesh) { o.castShadow = false; o.receiveShadow = false; } });
  const g = new THREE.Group();
  g.add(scene);
  return g;
}

class Cell {
  /* x/y/w/h are CANVAS-LOCAL coordinates (y down from canvas top) */
  constructor(x, y, w, h, label) {
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.updaters = [];
    this.scene = new THREE.Scene();
    this.scene.background = new THREE.Color(0x20242e);
    this.camera = new THREE.PerspectiveCamera(40, w / h, 0.1, 100);
    this.camera.position.set(-1.55, 1.3, 2.6); // right-front 3/4 — the sword side
    this.camera.lookAt(0, 1.0, 0);
    this.scene.add(new THREE.HemisphereLight(0xffffff, 0x8899aa, 1.5));
    const sun = new THREE.DirectionalLight(0xfff2e0, 2.2);
    sun.position.set(3, 6, 4);
    this.scene.add(sun);
    const ground = new THREE.Mesh(new THREE.CircleGeometry(1.4, 32), new THREE.MeshStandardMaterial({ color: 0x2a303b }));
    ground.rotation.x = -Math.PI / 2;
    this.scene.add(ground);
    this.label = label;
    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;pointer-events:none;z-index:5;';
    this.labelCanvas = cv; this.labelCtx = cv.getContext('2d');
    document.body.appendChild(cv);
    this.drawLabel();
  }
  drawLabel() {
    const dpr = window.devicePixelRatio || 1;
    this.labelCanvas.width = this.w * dpr; this.labelCanvas.height = 26 * dpr;
    this.labelCanvas.style.width = this.w + 'px';
    this.labelCanvas.style.left = this.x + 'px';
    this.labelCanvas.style.top = (this.y + BAR_H) + 'px';
    this.labelCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
    this.labelCtx.clearRect(0, 0, this.w, 26);
    this.labelCtx.fillStyle = '#fbbf24';
    this.labelCtx.font = 'bold 13px system-ui';
    this.labelCtx.fillText(this.label, 8, 17);
  }
  draw(render) {
    const { x, y, w, h } = this;
    const yFlip = this.canvasH - y - h; // GL viewport y measured from canvas bottom
    render.setViewport(x, yFlip, w, h);
    render.setScissor(x, yFlip, w, h);
    render.setScissorTest(true);
    render.render(this.scene, this.camera);
    render.setViewport(0, 0, innerWidth, innerHeight);
    render.setScissorTest(false);
  }
}

async function main() {
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio || 1);
  document.body.appendChild(renderer.domElement);
  const layout = () => {
    const w = innerWidth, hh = innerHeight - BAR_H;
    renderer.setSize(w, hh);
    return { w, hh };
  };
  let { w, hh } = layout();
  const cw = () => Math.floor(w / 3), ch = () => Math.floor(hh / 2);
  const mk = (px, py, label) => new Cell(px * cw(), py * ch(), cw(), ch(), label);

  const sword = await buildSword();

  /* -------- row 1: the TRAVELLER (the game hero) + the arming sword -------- */
  const travGltf = await load('https://polyfork.dev/cdn/traveller-92f20c.glb');
  const trav = prep(travGltf, 1.8);
  const travHand = trav.scene.getObjectByName('attach-righthand');
  console.log('traveller attach-righthand:', travHand ? 'present' : 'MISSING');

  /* -------- row 2: the ELF ASSASSIN + its baked rapier (the CORRECT look) -- */
  const elfGltf = await load('/models/heroes/elf-assassin-944f87.glb');
  const elf = prep(elfGltf, 1.9);
  const rapier = elf.scene.getObjectByName('attach-held-rapier');
  if (rapier) rapier.visible = true;
  const dagger = elf.scene.getObjectByName('attach-held-stiletto-dagger');
  if (dagger) dagger.visible = false;

  /* 🔬 AUTO-CALIBRATION — measure the elf's baked rapier grip in RIGHTHAND
   * local space (bind pose: bone frames are world-aligned), then derive the
   * transform our sword (grip at origin, blade +Y, guard ±X) needs so it
   * grips the fist exactly like the elf's rapier in EVERY pose. */
  const elfHand = elf.scene.getObjectByName('RightHand');
  const elfRapierMesh = elf.scene.getObjectByName('rapier-body');
  const elfAttach = elf.scene.getObjectByName('attach-held-rapier');
  let AUTO = null;
  if (elfHand && elfRapierMesh && elfAttach) {
    elf.scene.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(elfRapierMesh);
    const corners = [];
    for (const x of [box.min.x, box.max.x]) for (const y of [box.min.y, box.max.y]) for (const z of [box.min.z, box.max.z]) corners.push(new THREE.Vector3(x, y, z));
    // (a) mesh bbox in the ATTACH NODE's own space — the authoring frame
    const ac = corners.map((c) => c.clone());
    for (const c of ac) elfAttach.worldToLocal(c);
    const ab = new THREE.Box3().setFromPoints(ac);
    const asz = new THREE.Vector3(); ab.getSize(asz);
    console.log('ELF rapier bbox in ATTACH space: min', ab.min.toArray().map((v) => v.toFixed(3)), 'max', ab.max.toArray().map((v) => v.toFixed(3)), 'size', asz.toArray().map((v) => v.toFixed(3)));
    console.log('ELF attach TRS: t', elfAttach.position.toArray().map((v) => v.toFixed(3)), 'q', elfAttach.quaternion.toArray().map((v) => v.toFixed(3)));
    // (b) the attach node origin & the mesh bbox CENTER expressed in RightHand space
    const attachOriginHand = elfAttach.position.clone(); // attach is a direct child of RightHand
    const center = corners.map((c) => c.clone());
    for (const c of center) elfHand.worldToLocal(c);
    const hb = new THREE.Box3().setFromPoints(center);
    console.log('ELF rapier bbox in RightHand space: min', hb.min.toArray().map((v) => v.toFixed(3)), 'max', hb.max.toArray().map((v) => v.toFixed(3)));
  } else console.warn('elf measurement failed', !!elfHand, !!elfRapierMesh, !!elfAttach);

  /* every cell gets its own skeleton-safe clone + mixer; sword cells attach a fresh clone */
  const buildCell = (px, py, label, gltf, src, freezeClip, freezeAt, attachSword) => {
    const cell = mk(px, py, label);
    const clone = skeletonClone(src.scene);
    const g = new THREE.Group();
    g.add(clone);
    g.scale.copy(src.body.scale);
    cell.scene.add(g);
    const mixer = new THREE.AnimationMixer(clone);
    const aIdle = gltf.animations.find((c) => c.name === 'Idle');
    if (aIdle && !freezeClip) mixer.clipAction(aIdle).play(); // freeze cells: the clip owns 100% (game steady state)
    if (attachSword) {
      const hand = clone.getObjectByName('attach-righthand');
      const sw = sword.clone(true);
      sw.position.set(POS[0], POS[1], POS[2]);
      sw.rotation.set(ROT[0], ROT[1], ROT[2]);
      if (hand) { hand.add(sw); if (AXES) axesGizmo(hand); }
      else console.warn('no attach-righthand in clone');
    }
    if (freezeClip) {
      buildClip(clone, freezeClip).then((c) => {
        if (!c) { console.warn('clip failed', freezeClip); return; }
        const a = mixer.clipAction(c);
        a.setEffectiveWeight(1);
        a.play();
        cell.updaters.push(() => mixer.setTime(c.duration * freezeAt));
      });
    } else {
      cell.updaters.push(() => mixer.update(1 / 60));
    }
    return cell;
  };

  const grid = [
    buildCell(0, 0, 'TRAVELLER · Idle + sword', travGltf, trav, null, 0, true),
    buildCell(1, 0, 'TRAVELLER · Sword idle @' + IDLE_T, travGltf, trav, 'Sword idle', IDLE_T, true),
    buildCell(2, 0, 'TRAVELLER · Sword attack @' + ATTACK_T, travGltf, trav, 'Sword attack', ATTACK_T, true),
    buildCell(0, 1, 'ELF · Idle + baked rapier', elfGltf, elf, null, 0, false),
    buildCell(1, 1, 'ELF · Sword idle @' + IDLE_T, elfGltf, elf, 'Sword idle', IDLE_T, false),
    buildCell(2, 1, 'ELF · Sword attack @' + ATTACK_T, elfGltf, elf, 'Sword attack', ATTACK_T, false),
  ];

  const relayout = () => {
    ({ w, hh } = layout());
    grid.forEach((c, i) => {
      const px = i % 3, py = Math.floor(i / 3);
      c.x = px * cw(); c.w = cw();
      c.y = py * ch(); c.h = ch();
      c.canvasH = hh;
      c.camera.aspect = c.w / c.h;
      c.camera.updateProjectionMatrix();
      c.drawLabel();
    });
  };
  relayout();
  window.addEventListener('resize', relayout);
  /* debug: expose frozen hand frames for traveller vs elf comparison */
  window.__gripDebug = grid.map((c) => {
    const clone = c.scene.children.find((o) => o.type === 'Group')?.children[0];
    const hand = clone?.getObjectByName('RightHand');
    return { label: c.label, hand };
  });
  setTimeout(() => {
    for (const d of window.__gripDebug) {
      if (!d.hand) { console.log('DEBUG', d.label, 'no hand'); continue; }
      const p = d.hand.getWorldPosition(new THREE.Vector3());
      console.log('DEBUG', d.label, 'handQ', d.hand.quaternion.toArray().map((v) => v.toFixed(3)).join(','), 'handWorldPos', p.toArray().map((v) => v.toFixed(3)).join(','));
    }
  }, 2500);

  renderer.setAnimationLoop(() => {
    for (const c of grid) for (const u of c.updaters) u();
    renderer.setViewport(0, 0, innerWidth, hh);
    renderer.setScissor(0, 0, innerWidth, hh);
    renderer.clear();
    for (const c of grid) c.draw(renderer);
  });
}
main().catch((e) => { console.error(e); document.body.insertAdjacentHTML('beforeend', '<pre style="color:#f87171">' + e.stack + '</pre>'); });
</script>
</body>
</html>
