<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "/__test/three.module.js" } }
</script>
<style>body{margin:0;background:#222}</style>
</head>
<body>
<div id="views" style="display:grid;grid-template-columns:1fr 1fr 1fr"></div>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "/__test/addons/loaders/GLTFLoader.js";

const PIVOT_AT_ORIGIN = new Set(["craneTop"]);
const cache = new Map();
function loadKind(name, url) {
  return new Promise((res) => {
    new GLTFLoader().load(url, (g) => {
      const scene = g.scene;
      const box = new THREE.Box3().setFromObject(scene);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      const groundY = box.min.y;
      const pivot = PIVOT_AT_ORIGIN.has(name);
      scene.position.set(pivot ? 0 : -center.x, -box.min.y, pivot ? 0 : -center.z);
      const wrap = new THREE.Group();
      wrap.add(scene);
      wrap.updateMatrixWorld(true);
      cache.set(name, { template: wrap, size, groundY });
      res(name);
    }, undefined, (e) => { console.error("load fail", name, e); res(name); });
  });
}

async function main() {
  await Promise.all([
    loadKind("craneMast", "/models/construction/tower-crane-mast-1784a3.glb"),
    loadKind("craneTop", "/models/construction/tower-crane-top-d8d9c9.glb"),
    loadKind("track", "/models/railway/straight-track-d4cf38.glb"),
  ]);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x88aadd);
  scene.add(new THREE.AmbientLight(0xffffff, 1.4));
  const sun = new THREE.DirectionalLight(0xffffff, 2.2);
  sun.position.set(60, 90, 40);
  scene.add(sun);

  const world = new THREE.Group();
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ color: 0x6a8f5a }));
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.02;
  world.add(ground);

  function place(kind, x, y, z, rot = 0, s = 1) {
    const g = cache.get(kind).template.clone();
    g.position.set(x, y, z);
    g.rotation.y = rot;
    g.scale.setScalar(s);
    world.add(g);
    return g;
  }

  /* crane A — two stacked masts + top mounted at 30 (game math) */
  place("craneMast", -60, 0, 0);
  place("craneMast", -60, 15, 0);
  place("craneTop", -60, 30 + cache.get("craneTop").groundY, 0, Math.PI * 0.25);
  /* crane B — one mast + top at 15 (game math) */
  place("craneMast", 60, 0, 0);
  place("craneTop", 60, 15 + cache.get("craneTop").groundY, 0, -Math.PI * 0.3);
  /* crane C — float reference: top mounted 2m too high */
  place("craneMast", 0, 0, 0);
  place("craneTop", 0, 15 + cache.get("craneTop").groundY + 2, 0, 0.6);
  /* railway arc sample near station angle */
  {
    const R = 180, a0 = 2.15, a1 = 2.5;
    for (let a = a0; a < a1; a += 4.0 / R) place("track", Math.cos(a) * R, 0.02, Math.sin(a) * R, -a);
  }
  scene.add(world);

  const W = 520, H = 390;
  const views = [
    { pos: [-60, 2.2, 60], tgt: [-60, 32, 0] },        // crane A from ground
    { pos: [-45, 30.5, 13], tgt: [-60, 30.5, 0] },     // crane A joint close-up (side)
    { pos: [-60, 33, 8], tgt: [-60, 29.5, 0] },        // crane A joint from above
    { pos: [78, 2.2, 26], tgt: [60, 17, 0] },          // crane B from ground
    { pos: [70, 16.5, 10], tgt: [60, 16, 0] },         // crane B joint close-up
    { pos: [6, 13, 22], tgt: [0, 16, 0] },             // crane C float reference
    { pos: [Math.cos(2.32) * 155, 6, Math.sin(2.32) * 155], tgt: [Math.cos(2.32) * 185, 1, Math.sin(2.32) * 185] }, // rails along
    { pos: [Math.cos(2.3) * 205, 25, Math.sin(2.3) * 205], tgt: [Math.cos(2.3) * 180, 0, Math.sin(2.3) * 180] },   // rails from above
  ];
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W * 3, H * 3);
  document.getElementById("views").appendChild(renderer.domElement);
  renderer.setScissorTest(true);
  views.forEach((v, i) => {
    const cam = new THREE.PerspectiveCamera(50, W / H, 0.1, 900);
    cam.position.set(...v.pos);
    cam.lookAt(...v.tgt);
    const x = (i % 3) * W, y = Math.floor(i / 3) * H;
    renderer.setViewport(x, H * 3 - H - y, W, H);
    renderer.setScissor(x, H * 3 - H - y, W, H);
    renderer.render(scene, cam);
  });
  renderer.setScissorTest(false);
  window.__ready = true;
}
main();
</script>
</body>
</html>
